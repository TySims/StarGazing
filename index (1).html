<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stargazers</title>
<style>
  html, body { margin: 0; height: 100%; background: #05081e; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { max-width: 100%; max-height: 100%; aspect-ratio: 3 / 2; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c" width="900" height="600"></canvas>
<script>
const W = 900, H = 600;
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const rnd = (a, b) => a + Math.random() * (b - a);
const rndInt = (a, b) => Math.floor(rnd(a, b + 1));
const TAU = Math.PI * 2;

// ---------- Sky ----------
const sky = ctx.createLinearGradient(0, 0, 0, H);
sky.addColorStop(0, "rgb(5,8,30)");
sky.addColorStop(1, "rgb(30,28,85)");

// ---------- Stars ----------
const sizes = [1, 1, 1, 2, 2, 3];
const stars = Array.from({ length: 320 }, () => ({
  x: rndInt(0, W),
  y: rndInt(0, H * 0.75),
  size: sizes[rndInt(0, sizes.length - 1)],
  phase: rnd(0, 6.28),
  speed: rnd(0.03, 0.09),
}));

// ---------- "Kinship" written in stars ----------
const KINSHIP_START = 60 * 20;  // frames (about 20 seconds in)
const KINSHIP_FLY = 240;        // frames each star takes to fly into place
const kin = [];
(function buildKinship() {
  const off = document.createElement("canvas");
  off.width = W; off.height = H;
  const o = off.getContext("2d");
  const R = 270, cx = 235, cy = 450, fs = 80, gap = 7;   // arc radius and centre
  o.font = `bold ${fs}px Verdana, Arial, Helvetica, sans-serif`;
  o.fillStyle = "#fff";
  o.textAlign = "center";
  o.textBaseline = "alphabetic";
  const chars = "Kinship".split("");
  const ws = chars.map(c => o.measureText(c).width + gap);
  let ang = -Math.PI / 2 - (ws.reduce((a, b) => a + b, 0) / R) / 2;
  chars.forEach((c, i) => {                // place each letter along the curve
    const a = ang + ws[i] / 2 / R;
    o.save();
    o.translate(cx + R * Math.cos(a), cy + R * Math.sin(a));
    o.rotate(a + Math.PI / 2);
    o.fillText(c, 0, 0);
    o.restore();
    ang += ws[i] / R;
  });
  const data = o.getImageData(0, 0, W, H).data;
  const step = 4;
  for (let y = 0; y < H; y += step) {
    for (let x = 0; x < W; x += step) {
      if (data[(y * W + x) * 4 + 3] > 128) {
        kin.push({
          tx: x + rnd(-0.8, 0.8), ty: y + rnd(-0.8, 0.8),
          sx: rnd(0, W), sy: rnd(0, H * 0.7),
          delay: rnd(0, 360),
          size: rnd(0.8, 1.4),
          phase: rnd(0, 6.28), speed: rnd(0.04, 0.09),
        });
      }
    }
  }
})();

function drawKinship() {
  for (const k of kin) {
    const p = Math.min(1, (t - KINSHIP_START - k.delay) / KINSHIP_FLY);
    if (p <= 0) continue;
    const e = 1 - Math.pow(1 - p, 3);
    const x = k.sx + (k.tx - k.sx) * e;
    const y = k.sy + (k.ty - k.sy) * e;
    const tw = 0.85 + 0.15 * Math.sin(t * k.speed + k.phase);
    const a = (0.2 + 0.4 * p) * tw;
    if (p >= 1) {
      ctx.fillStyle = `rgba(200,210,255,${0.05 * tw})`;
      ctx.beginPath(); ctx.arc(x, y, k.size * 3, 0, TAU); ctx.fill();
    }
    ctx.fillStyle = `rgba(255,255,245,${a})`;
    ctx.beginPath(); ctx.arc(x, y, k.size, 0, TAU); ctx.fill();
  }
}

// ---------- Moon ----------
const MOON = { x: 730, y: 140, r: 48 };
const glow = ctx.createRadialGradient(MOON.x, MOON.y, MOON.r, MOON.x, MOON.y, 150);
glow.addColorStop(0, "rgba(230,230,190,0.24)");
glow.addColorStop(0.4, "rgba(230,230,190,0.08)");
glow.addColorStop(1, "rgba(230,230,190,0)");
const craters = [[-15, -10, 9], [12, 8, 12], [-5, 22, 6], [20, -18, 6]];

function drawMoon() {
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(MOON.x, MOON.y, 150, 0, TAU); ctx.fill();
  ctx.fillStyle = "rgb(240,238,210)";
  ctx.beginPath(); ctx.arc(MOON.x, MOON.y, MOON.r, 0, TAU); ctx.fill();
  ctx.fillStyle = "rgb(215,212,185)";
  for (const [dx, dy, r] of craters) {
    ctx.beginPath(); ctx.arc(MOON.x + dx, MOON.y + dy, r, 0, TAU); ctx.fill();
  }
}

// ---------- Hill ----------
const hillY = x => H - 120 + 22 * Math.sin(x / 140) + 10 * Math.sin(x / 55);
function drawHill() {
  ctx.fillStyle = "rgb(8,10,20)";
  ctx.beginPath();
  ctx.moveTo(0, H);
  for (let x = 0; x <= W + 10; x += 10) ctx.lineTo(x, hillY(x));
  ctx.lineTo(W, H);
  ctx.closePath();
  ctx.fill();
}

// ---------- Shooting stars ----------
let shooting = [];
function spawnShootingStar() {
  shooting.push({
    x: rndInt(50, W * 0.7), y: rndInt(20, H * 0.3),
    vx: rnd(9, 13), vy: rnd(4, 7), life: rndInt(35, 55),
  });
}
function updateShootingStars() {
  for (const s of shooting) { s.x += s.vx; s.y += s.vy; s.life--; }
  shooting = shooting.filter(s => s.life > 0 && s.x < W + 50);
}
function drawShootingStars() {
  ctx.lineCap = "round";
  for (const s of shooting) {
    for (let i = 0; i < 14; i++) {
      const fade = 1 - i / 14, c = Math.floor(255 * fade);
      ctx.strokeStyle = `rgb(${c},${c},${Math.floor(c * 0.9)})`;
      ctx.lineWidth = Math.max(1, Math.floor(3 * fade));
      ctx.beginPath();
      ctx.moveTo(s.x - s.vx * i * 0.8, s.y - s.vy * i * 0.8);
      ctx.lineTo(s.x - s.vx * (i + 1) * 0.8, s.y - s.vy * (i + 1) * 0.8);
      ctx.stroke();
    }
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(s.x, s.y, 3, 0, TAU); ctx.fill();
  }
}

// ---------- People (seen from behind, sitting) ----------
const PEOPLE = {
  a: { cloth: "rgb(70,86,130)", pants: "rgb(38,44,68)", hair: "rgb(28,22,28)", skin: "rgb(150,116,104)", long: true },
  b: { cloth: "rgb(122,80,94)", pants: "rgb(40,44,64)", hair: "rgb(70,50,40)",  skin: "rgb(158,124,108)", long: false },
};
const RIM = "rgb(165,165,190)"; // moonlight catching the right edge

function figurePass(x, ground, pal, tilt, target, rim) {
  const C = k => (rim ? RIM : pal[k]);

  // seat / lower body resting on the hill
  ctx.fillStyle = C("pants");
  ctx.beginPath(); ctx.ellipse(x, ground - 4, 21, 9, 0, 0, TAU); ctx.fill();

  // torso with rounded shoulders
  ctx.fillStyle = C("cloth");
  ctx.beginPath();
  ctx.moveTo(x - 16, ground - 2);
  ctx.bezierCurveTo(x - 18, ground - 18, x - 19, ground - 30, x - 17, ground - 38);
  ctx.quadraticCurveTo(x - 12, ground - 43, x - 5, ground - 44);
  ctx.lineTo(x + 5, ground - 44);
  ctx.quadraticCurveTo(x + 12, ground - 43, x + 17, ground - 38);
  ctx.bezierCurveTo(x + 19, ground - 30, x + 18, ground - 18, x + 16, ground - 2);
  ctx.closePath(); ctx.fill();

  const hx = x + tilt, hy = ground - 58;

  // neck
  ctx.fillStyle = C("skin");
  ctx.fillRect(x - 3.5 + tilt * 0.4, ground - 52, 7, 10);

  // head: ears + skin, then hair on top
  ctx.beginPath(); ctx.ellipse(hx, hy, 9.5, 11, tilt * 0.03, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(hx - 9.5, hy + 1, 2.4, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(hx + 9.5, hy + 1, 2.4, 0, TAU); ctx.fill();
  ctx.fillStyle = C("hair");
  ctx.beginPath(); ctx.ellipse(hx, hy - 1.5, 10, 10.5, tilt * 0.03, 0, TAU); ctx.fill();
  if (pal.long) { // longer hair falling over the shoulders
    ctx.beginPath();
    ctx.moveTo(hx - 10, hy - 2);
    ctx.lineTo(hx - 11, ground - 35);
    ctx.quadraticCurveTo(hx, ground - 30, hx + 11, ground - 35);
    ctx.lineTo(hx + 10, hy - 2);
    ctx.closePath(); ctx.fill();
  }

  // arms
  const side = target ? (target[0] >= x ? 1 : -1) : 0;
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  for (const s of [-1, 1]) {
    if (s === side) continue;
    ctx.strokeStyle = C("cloth"); ctx.lineWidth = 7;
    ctx.beginPath(); ctx.moveTo(x + s * 16, ground - 37); ctx.lineTo(x + s * 19, ground - 12); ctx.stroke();
    ctx.fillStyle = C("skin");
    ctx.beginPath(); ctx.arc(x + s * 19, ground - 9, 3, 0, TAU); ctx.fill();
  }
  if (side) { // raised, pointing arm with elbow bend
    const sx = x + side * 15, sy = ground - 38;
    const dx = target[0] - sx, dy = target[1] - sy;
    const d = Math.hypot(dx, dy) || 1;
    const ux = dx / d, uy = dy / d;
    const hxp = sx + ux * 32, hyp = sy + uy * 32;
    const ex = sx + ux * 16 + (-uy) * 3 * side * -1, ey = sy + uy * 16 + 5;
    ctx.strokeStyle = C("cloth");
    ctx.lineWidth = 7;
    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.stroke();
    ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(ex, ey); ctx.lineTo(hxp, hyp); ctx.stroke();
    ctx.fillStyle = C("skin");
    ctx.beginPath(); ctx.arc(hxp + ux * 2, hyp + uy * 2, 3.5, 0, TAU); ctx.fill();
    // pointing finger
    ctx.strokeStyle = C("skin"); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(hxp, hyp); ctx.lineTo(hxp + ux * 8, hyp + uy * 8); ctx.stroke();
  }
}

function drawPerson(x, pal, tilt, target) {
  const ground = hillY(x) + 6;
  figurePass(x + 1.6, ground, pal, tilt, target, true);  // rim light
  figurePass(x, ground, pal, tilt, target, false);       // the person
}

// ---------- Extra scenery ----------
const milky = document.createElement("canvas");
milky.width = W; milky.height = H;
(function () {                       // faint Milky Way band
  const m = milky.getContext("2d");
  m.translate(W * 0.55, H * 0.3); m.rotate(-0.5);
  for (let i = 0; i < 60; i++) {
    const x = rnd(-700, 700), y = rnd(-50, 50) * rnd(0.2, 1), r = rnd(40, 120);
    const g = m.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, "rgba(150,160,230,0.045)");
    g.addColorStop(1, "rgba(150,160,230,0)");
    m.fillStyle = g; m.fillRect(x - r, y - r, r * 2, r * 2);
  }
})();

const backY = x => H - 175 + 26 * Math.sin(x / 190 + 1) + 12 * Math.sin(x / 70);
function drawBackHill() {
  ctx.fillStyle = "rgb(15,17,38)";
  ctx.beginPath(); ctx.moveTo(0, H);
  for (let x = 0; x <= W + 10; x += 10) ctx.lineTo(x, backY(x));
  ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
}

function drawBlanket() {
  const y = hillY(449) + 6;
  ctx.fillStyle = "rgb(86,52,66)";
  ctx.beginPath(); ctx.ellipse(449, y, 64, 9, 0, 0, TAU); ctx.fill();
}

const flies = Array.from({ length: 14 }, () => ({ x: rnd(0, W), y: rnd(400, 570), p: rnd(0, 6.28), s: rnd(0.01, 0.03) }));
function drawFireflies() {
  for (const f of flies) {
    f.x += Math.cos(f.p + t * 0.01) * 0.25;
    f.y = Math.min(575, Math.max(400, f.y + Math.sin(f.p * 2 + t * 0.013) * 0.2));
    if (f.x < 0) f.x = W; if (f.x > W) f.x = 0;
    const a = 0.5 + 0.5 * Math.sin(t * f.s * 3 + f.p);
    ctx.fillStyle = `rgba(220,255,150,${a * 0.15})`;
    ctx.beginPath(); ctx.arc(f.x, f.y, 7, 0, TAU); ctx.fill();
    ctx.fillStyle = `rgba(240,255,190,${a})`;
    ctx.beginPath(); ctx.arc(f.x, f.y, 1.4, 0, TAU); ctx.fill();
  }
}

const vig = ctx.createRadialGradient(W / 2, H / 2, H * 0.45, W / 2, H / 2, H * 0.95);
vig.addColorStop(0, "rgba(0,0,10,0)");
vig.addColorStop(1, "rgba(0,0,10,0.45)");

// ---------- Pointing at the sky every so often ----------
const pointers = [0, 1].map(() => ({ amt: 0, ax: 0, ay: 0, side: 1, target: null }));
let nextPoint = 180, pointer = 1, skyTarget = null, pointUntil = 0;

function updatePointing() {
  if (t >= nextPoint) {                 // start a calm point at a random star
    pointer = Math.random() < 0.5 ? 0 : 1;
    skyTarget = [rnd(100, 800), rnd(40, 300)];
    pointUntil = t + rndInt(150, 240);
    nextPoint = pointUntil + rndInt(200, 480);
  }
  const newest = shooting.length ? shooting[shooting.length - 1] : null;
  pointers.forEach((p, i) => {
    const px = i === 0 ? 430 : 468;
    let target = null;
    if (i === 1 && newest) target = [newest.x, newest.y];
    else if (i === pointer && t < pointUntil) target = skyTarget;
    if (target) {
      if (p.amt < 0.02) {                 // arm starts from rest
        p.side = target[0] >= px ? 1 : -1;
        p.ax = target[0]; p.ay = target[1];
      }
      p.ax += (target[0] - p.ax) * 0.15;
      p.ay += (target[1] - p.ay) * 0.15;
      p.amt = Math.min(1, p.amt + 0.05);
    } else {
      p.amt = Math.max(0, p.amt - 0.04);
    }
  });
}

function aimFor(i, x) {
  const p = pointers[i];
  if (p.amt < 0.02) return null;
  const ground = hillY(x) + 6;
  const e = p.amt * p.amt * (3 - 2 * p.amt);          // smooth ease
  const rx = x + p.side * 19, ry = ground - 9;         // resting hand position
  return [rx + (p.ax - rx) * e, ry + (p.ay - ry) * e];
}

// ---------- Input ----------
canvas.addEventListener("pointerdown", spawnShootingStar);

// ---------- Main loop (fixed ~60 fps) ----------
let t = 0, last = 0, acc = 0;
const STEP = 1000 / 60;

function tick() {
  t++;
  if (Math.random() < 0.01) spawnShootingStar();
  updateShootingStars();
  updatePointing();

  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
  ctx.drawImage(milky, 0, 0);

  for (const s of stars) {
    const b = Math.floor(170 + 85 * Math.sin(t * s.speed + s.phase));
    ctx.fillStyle = `rgb(${b},${b},${Math.min(255, b + 20)})`;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.size, 0, TAU); ctx.fill();
  }

  drawKinship();
  drawMoon();
  drawShootingStars();
  drawBackHill();
  drawHill();
  drawBlanket();
  drawFireflies();

  const bob = Math.sin(t * 0.03) * 1.5;
  drawPerson(430, PEOPLE.a, -2 + bob, aimFor(0, 430));
  drawPerson(468, PEOPLE.b, 2 - bob, aimFor(1, 468));

  ctx.fillStyle = vig; ctx.fillRect(0, 0, W, H);
}

function frame(now) {
  acc += Math.min(now - last, 250);
  last = now;
  while (acc >= STEP) { tick(); acc -= STEP; }
  requestAnimationFrame(frame);
}
requestAnimationFrame(now => { last = now; frame(now); });
</script>
</body>
</html>
